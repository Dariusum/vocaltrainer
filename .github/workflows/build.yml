name: Build APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "name=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up signing keystore
        run: |
          mkdir -p ~/.android
          cp .signing/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/vocaltrainer.apk \
             vocaltrainer-${{ steps.version.outputs.name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocaltrainer-${{ steps.version.outputs.name }}
          path: vocaltrainer-${{ steps.version.outputs.name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vocaltrainer ${{ steps.version.outputs.name }}
          files: vocaltrainer-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
