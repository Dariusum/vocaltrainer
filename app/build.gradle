plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versionNameStr = System.getenv("VERSION_NAME") ?: "dev"
def computedVersionCode = 1
def normalizedVersion = versionNameStr.startsWith("v") ? versionNameStr.substring(1) : versionNameStr
def versionParts = normalizedVersion.split("\\.")
if (versionParts.length >= 3) {
    try {
        computedVersionCode = versionParts[0].toInteger() * 10000 + versionParts[1].toInteger() * 100 + versionParts[2].toInteger()
    } catch (ignored) { computedVersionCode = 1 }
}

android {
    namespace 'com.example.vocaltrainer'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.vocaltrainer"
        minSdk 26
        targetSdk 35
        versionCode computedVersionCode
        versionName versionNameStr
    }

    signingConfigs {
        debug {
            storeFile file("${rootDir}/.signing/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    androidResources {
        // .tflite darf nicht komprimiert in die APK gepackt werden, sonst kann die
        // Modell-Datei nicht per mmap direkt aus den Assets geladen werden.
        noCompress += "tflite"
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set(variant.buildType == "debug" ? "vocaltrainer.apk" : "vocaltrainer-${variant.buildType}.apk")
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ViewModel + Fragment
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // On-device KI-Stimmtrennung (Phase B) — LiteRT (Nachfolger von TensorFlow Lite)
    implementation 'com.google.ai.edge.litert:litert:2.1.6'

    // Nur für lokale JVM-Tests der FFT/STFT-Mathematik (kein Android-Framework nötig)
    testImplementation 'junit:junit:4.13.2'
}
